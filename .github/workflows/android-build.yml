# Build آنلاین APK اپ اندروید — بدون نیاز به نصب هیچ‌چیز روی سیستم شما
#
# راه‌اندازی (یک‌بار در GitHub):
#   Settings → Secrets and variables → Actions → New repository secret:
#     CONVEX_URL            (الزامی)  مثال: https://neat-colts-report-123.convex.cloud
#     GOOGLE_SERVICES_JSON  (اختیاری) کل محتوای فایل google-services.json برای Push والد
#
# گرفتن APK:
#   تب Actions → انتخاب آخرین اجرای «Android APK» → بخش Artifacts → دانلود app-debug-apk

name: Android APK

on:
  workflow_dispatch: {}
  push:
    branches: [main, master]
    paths:
      - "android/**"
      - ".github/workflows/android-build.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CONVEX_URL: ${{ secrets.CONVEX_URL }}
      GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Restore google-services.json (optional, parent push)
        if: env.GOOGLE_SERVICES_JSON != ''
        run: printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json

      - name: Build debug APK
        working-directory: android
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
